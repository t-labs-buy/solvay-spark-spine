# The server stack: the app image plus Postgres/pgvector, Ollama, Neo4j and
# Hindsight. See docs/deployment.md. For local development compose.neo4j.yml is
# still the one to use (it runs only Neo4j, next to ./scripts/run.sh).
#
#   docker compose up -d
#
# Reads .env from this directory (template: .env.example).
#
# Every container joins the server's shared ivolve-network, as the platform
# requires. That network is shared with other teams' stacks, and on it a
# service is reachable by its service name. So every service that is called by
# name has a solvay- prefix: a generic "postgres" there would clash with
# another stack's "postgres", and Docker would hand out either address, sending
# our app to the wrong database at random. Keep the prefix on any service added
# here, and use the prefixed name in every URL.

services:
  app:
    image: reg.ivolve.cloud/ivolve/solvay-spark-spine:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spark:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@solvay-postgres:5432/solvay
      OLLAMA_HOST: http://solvay-ollama:11434
      NEO4J_URI: bolt://solvay-neo4j:7687
      # Evidence Agent memory (the solvay-hindsight service below). Empty turns
      # it off.
      HINDSIGHT_URL: http://solvay-hindsight:8888
    ports:
      # Put a TLS reverse proxy in front before opening this beyond the host:
      # /api/* has no authentication (see docs/deployment.md).
      - "${APP_PORT:-8000}:8000"
    volumes:
      - workdir:/app/.workdir
      # Seeded from the image on first start; graph rebuilds rewrite it.
      - graph-data:/app/data
      # The SPARK corpus, copied to the server separately.
      - ./solvay-spark:/app/solvay-spark:ro
      # Part of the corpus too: the BPML hierarchy the graph is built on
      # (BPML_Process_xlsx.md) and documents added from the UI. Copied to the
      # server separately; writable, because the UI adds to it. The container
      # runs as uid 1000, so the folder must be writable by that user.
      - ./knowledge_base:/app/knowledge_base
    # The proxy reaches the app by its container name,
    # solvay-spark-spine-app-1, so the service keeps its short name.
    networks:
      - ivolve-network
    depends_on:
      solvay-postgres:
        condition: service_healthy
      solvay-ollama:
        condition: service_started
      solvay-neo4j:
        condition: service_healthy

  solvay-postgres:
    image: docker.io/pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      # A superuser: the app runs CREATE EXTENSION vector and creates the
      # solvay_session database for uploads (backend/rag/rag.py).
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: solvay
    volumes:
      # pg18 images keep their data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    networks:
      - ivolve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d solvay"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the hindsight database beside solvay, then exits.
  # POSTGRES_DB only acts on a brand-new volume, and the server's was created
  # before Hindsight joined the stack, so this checks and creates it itself.
  solvay-hindsight-db:
    image: docker.io/pgvector/pgvector:pg18
    environment:
      PGHOST: solvay-postgres
      PGUSER: spark
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Retries: a brand-new Postgres reports healthy while its first-start
    # setup still refuses TCP connections.
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 30); do
          psql -d solvay -tAc "select 1" >/dev/null 2>&1 && break
          sleep 2
        done
        psql -d solvay -tAc "select 1 from pg_database where datname = 'hindsight'" | grep -q 1 || createdb hindsight
    networks:
      - ivolve-network
    depends_on:
      solvay-postgres:
        condition: service_healthy
    restart: "no"

  # Hindsight, the Evidence Agent's long-term memory (docs/agent-memory.md).
  # Same models as scripts/hindsight.sh: Opus reads and files what each
  # investigation found, Sonnet answers "Ask memory" within its deadline.
  solvay-hindsight:
    image: reg.ivolve.cloud/ivolve/solvay-spark-spine-hindsight:${HINDSIGHT_TAG:-latest}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://spark:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@solvay-postgres:5432/hindsight
      HINDSIGHT_API_LLM_PROVIDER: litellm
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_MODEL:-anthropic/claude-opus-5}
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      HINDSIGHT_API_REFLECT_LLM_MODEL: ${HINDSIGHT_REFLECT_MODEL:-anthropic/claude-sonnet-5}
      HINDSIGHT_API_REFLECT_LLM_TIMEOUT: ${HINDSIGHT_REFLECT_TIMEOUT:-60}
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
    # On the network like the rest: it reads and writes its database in
    # solvay-postgres, and the app calls it at solvay-hindsight:8888.
    networks:
      - ivolve-network
    depends_on:
      solvay-hindsight-db:
        condition: service_completed_successfully

  solvay-ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks:
      - ivolve-network

  # One-shot: pulls the embedding model into the ollama volume, then exits.
  solvay-ollama-pull:
    image: docker.io/ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://solvay-ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    networks:
      - ivolve-network
    depends_on:
      - solvay-ollama
    restart: "no"

  solvay-neo4j:
    image: docker.io/library/neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_tx__log_rotation_retention__policy: 100M size
      NEO4J_db_tx__log_rotation_size: 32M
    volumes:
      - neo4j-data:/data
    networks:
      - ivolve-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

# Named by the keys below, not by the services, so renaming a service keeps its
# data: solvay-postgres still mounts solvay-spark-spine_pgdata.
volumes:
  workdir:
  graph-data:
  pgdata:
  ollama:
  neo4j-data:

networks:
  # The server's shared network, created and managed outside this stack. Every
  # service joins it (see the note at the top), so the names on it must be
  # unique across all the stacks on the server.
  ivolve-network:
    external: true

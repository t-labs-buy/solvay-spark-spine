# The server stack: the app image plus Postgres/pgvector, Ollama and Neo4j.
# See docs/deployment.md. For local development compose.neo4j.yml is still the
# one to use (it runs only Neo4j, next to ./scripts/run.sh).
#
#   docker compose up -d
#
# Reads .env from this directory (template: .env.example).

services:
  app:
    image: reg.ivolve.cloud/ivolve/solvay-spark-spine:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spark:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/docling
      OLLAMA_HOST: http://ollama:11434
      NEO4J_URI: bolt://neo4j:7687
      # Evidence Agent memory needs its own server; not part of this stack.
      HINDSIGHT_URL: ""
    ports:
      # Put a TLS reverse proxy in front before opening this beyond the host:
      # /api/* has no authentication (see docs/deployment.md).
      - "${APP_PORT:-8000}:8000"
    volumes:
      - workdir:/app/.workdir
      - knowledge-base:/app/knowledge_base
      # Seeded from the image on first start; graph rebuilds rewrite it.
      - graph-data:/app/data
      # The SPARK corpus, copied to the server separately.
      - ./solvay-spark:/app/solvay-spark:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy

  postgres:
    image: docker.io/pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      # A superuser: the app runs CREATE EXTENSION vector and creates the
      # docling_session database for uploads (backend/rag/rag.py).
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: docling
    volumes:
      # pg18 images keep their data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d docling"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  # One-shot: pulls the embedding model into the ollama volume, then exits.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    depends_on:
      - ollama
    restart: "no"

  neo4j:
    image: docker.io/library/neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_tx__log_rotation_retention__policy: 100M size
      NEO4J_db_tx__log_rotation_size: 32M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  workdir:
  knowledge-base:
  graph-data:
  pgdata:
  ollama:
  neo4j-data:

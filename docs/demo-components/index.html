<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvay Spark Spine AI — Components in action — ArchFlow Demo</title>

    <!-- Self-contained viewer: no build step, no internet connection required.
     React/ReactDOM/Babel are vendored locally in ./vendor (see skill setup
     step — download once with curl if this folder doesn't exist yet). The
     component below is transpiled in the browser. -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/babel.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
      }
      /* Flex-centering must live on body ONLY. If html is also display:flex,
         body becomes a shrink-to-fit flex item and #root's width:100% resolves
         against that collapsed width — the demo renders at content width
         instead of filling max-width:1500px. */
      body {
        padding: 24px;
        min-height: 100vh;
        background: #05070c;
        display: flex;
        justify-content: center;
        transition: background 0.25s;
      }
      /* The demo defaults to light, so the page around it follows suit —
         otherwise a light card sits in a near-black frame. Toggled from the
         theme state; the TSX twin deliberately leaves its host page alone. */
      body.light-page {
        background: #eef1f6;
      }
      #root {
        width: 100%;
        max-width: 1500px;
      }

      /* ===== ArchFlow engine styles — identical to DemoFlow.template.css ===== */
      .archflow-container {
        --bg: #080b11;
        --panel: #0f131c;
        --panel-glass: rgba(15, 19, 28, 0.85);
        --ink: #f3f4f6;
        --muted: #9ca3af;
        --line: #1e293b;
        --line-active: #3b82f6;
        --accent: #6366f1;
        --grid: #131924;
        --node-fill: #0f131c;
        --node-stroke: #2e3b52;
        --edge-stroke: #1e293b;
        --bubble-bg: #f3f4f6;
        --bubble-border: #cbd5e1;
        --bubble-text: #1f2937;
        --bubble-who-color: #4b5563;
        --button-bg: #151c2c;
        --button-border: #2e3b52;
        --button-hover-bg: #1f293d;
        --button-hover-border: #3b4e6f;
        --scrollbar-thumb: #1e293b;
        --header-gradient: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        --done-fill: #121e1a;
        --done-stroke: rgba(34, 197, 94, 0.4);
        --shadow: rgba(0, 0, 0, 0.5);
        --accent-glow: rgba(99, 102, 241, 0.06);
        --node-active-stroke: #5a6578;
        --external-stroke: #6b7280;
        --external-fill: #11151f;

        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
        box-shadow: 0 4px 20px var(--shadow);
      }

      .archflow-container.light {
        --bg: #f4f4f8;
        --panel: #ffffff;
        --panel-glass: rgba(255, 255, 255, 0.85);
        --ink: #1f2433;
        --muted: #6b7280;
        --line: #cbd5e1;
        --line-active: #2563eb;
        --accent: #4f46e5;
        --grid: #dfe2ea;
        --node-fill: #ffffff;
        --node-stroke: #cbd5e1;
        --edge-stroke: #cbd5e1;
        --bubble-bg: #f3f4f6;
        --bubble-border: #cbd5e1;
        --button-bg: #ffffff;
        --button-border: #cbd5e1;
        --button-hover-bg: #f3f4f6;
        --button-hover-border: #94a3b8;
        --scrollbar-thumb: #cbd5e1;
        --header-gradient: linear-gradient(135deg, #1f2433 0%, #4b5563 100%);
        --done-fill: #e8f5e9;
        --done-stroke: rgba(34, 197, 94, 0.6);
        --shadow: rgba(0, 0, 0, 0.1);
        --accent-glow: rgba(99, 102, 241, 0.04);
        --node-active-stroke: #a5b4fc;
        --external-stroke: #94a3b8;
        --external-fill: #eef0f4;
      }

      .archflow-container * {
        box-sizing: border-box;
      }

      .archflow-container header {
        padding: 20px 24px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        transition:
          background 0.3s,
          border-color 0.3s;
      }

      .archflow-container header h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.015em;
        background: var(--header-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .archflow-container header p {
        margin: 5px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .archflow-container .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 24px;
        background: var(--panel-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }

      .archflow-container button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--button-border);
        background: var(--button-bg);
        color: var(--ink);
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
      }

      .archflow-container button:hover {
        background: var(--button-hover-bg);
        border-color: var(--button-hover-border);
        transform: translateY(-1px);
      }
      .archflow-container button:active {
        transform: translateY(1px);
      }

      .archflow-container button.primary {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        border-color: #6366f1;
        color: #fff;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      }
      .archflow-container button.primary:hover {
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.4);
      }
      .archflow-container button:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none !important;
        box-shadow: none !important;
      }

      .archflow-container .toolbar .spacer {
        flex: 1;
      }

      .archflow-container .speed {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .archflow-container .speed-btn {
        padding: 2px 8px;
        font-size: 13px;
        font-weight: 700;
        min-width: 24px;
        height: 24px;
        line-height: 1;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .archflow-container #speedVal {
        font-family: "JetBrains Mono", monospace;
        min-width: 38px;
        text-align: center;
        font-weight: 600;
        display: inline-block;
      }

      .archflow-container .phase-tag {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(99, 102, 241, 0.1);
        color: #a5b4fc;
        border: 1px solid rgba(99, 102, 241, 0.25);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .archflow-container.light .phase-tag {
        color: #4f46e5;
        background: rgba(79, 70, 229, 0.08);
        border: 1px solid rgba(79, 70, 229, 0.2);
      }
      .archflow-container .phase-tag::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 6px #4ade80;
        animation: statusPulse 1.8s infinite;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      .archflow-container .wrap {
        display: flex;
        gap: 0;
        align-items: stretch;
        min-height: 0;
      }

      .archflow-container .stage-area {
        flex: 1;
        min-width: 0;
        background: radial-gradient(
          circle,
          var(--grid) 1.2px,
          transparent 1.2px
        );
        background-size: 24px 24px;
        background-color: var(--bg);
        overflow: hidden;
        position: relative;
      }

      .archflow-container svg.stage {
        display: block;
        width: 100%;
        height: auto;
        /* Rubber-band selection drags across node labels — never let that turn
           into a text selection. */
        user-select: none;
        -webkit-user-select: none;
      }

      .archflow-container .side {
        width: 380px;
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      .archflow-container .side h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
      }

      .archflow-container .log {
        padding: 12px 18px 20px;
        overflow-y: auto;
        max-height: 65vh;
      }
      .archflow-container .log::-webkit-scrollbar {
        width: 6px;
      }
      .archflow-container .log::-webkit-scrollbar-track {
        background: transparent;
      }
      .archflow-container .log::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
      .archflow-container .log::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .archflow-container .log-item {
        display: flex;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 8px;
        border: 1px solid transparent;
        opacity: 0;
        transform: translateY(6px);
        animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes pop {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .archflow-container .log-item.cur {
        background: rgba(99, 102, 241, 0.04);
        border-color: rgba(99, 102, 241, 0.12);
      }

      .archflow-container .log-num {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
        color: #fff;
        background: var(--accent);
      }
      .archflow-container .log-item.data .log-num {
        background: #0ea5a4;
      }
      .archflow-container .log-item.work .log-num {
        background: #f59e0b;
      }

      .archflow-container .log-body {
        color: var(--ink);
        transition: color 0.3s;
      }
      .archflow-container .log-route {
        display: block;
        font-size: 11px;
        font-family: "JetBrains Mono", monospace;
        color: var(--muted);
        margin-bottom: 2px;
        font-weight: 600;
        transition: color 0.3s;
      }

      .archflow-container .edge {
        fill: none;
        stroke: var(--edge-stroke);
        stroke-width: 2.2;
        transition:
          stroke 0.25s,
          stroke-width 0.25s;
      }
      .archflow-container .edge.dashed {
        stroke-dasharray: 6 5;
      }
      .archflow-container .edge.active {
        stroke: var(--line-active);
        stroke-width: 3.5;
        filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.5));
        transition:
          stroke 0.25s,
          filter 0.25s;
      }
      .archflow-container .edge.active.call {
        stroke: #6366f1;
        filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5));
      }
      .archflow-container.light .edge.active.call {
        stroke: #4f46e5;
        filter: drop-shadow(0 0 5px rgba(79, 70, 229, 0.4));
      }
      .archflow-container .edge.active.data {
        stroke: #0ea5a4;
        filter: drop-shadow(0 0 5px rgba(14, 165, 164, 0.5));
      }
      .archflow-container .edge.active.flow {
        stroke-dasharray: 8 6;
        animation: dash 0.5s linear infinite;
      }
      .archflow-container .edge.active.flow.flow-reverse {
        animation: dash-reverse 0.5s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -28;
        }
      }
      @keyframes dash-reverse {
        to {
          stroke-dashoffset: 28;
        }
      }

      .archflow-container .arrow {
        fill: #475569;
        transition: fill 0.25s;
      }
      .archflow-container.light .arrow {
        fill: #94a3b8;
      }
      .archflow-container .arrow.blink {
        animation: arrowBlink 0.8s ease-in-out;
      }
      @keyframes arrowBlink {
        0%,
        100% {
          fill: #475569;
          filter: none;
        }
        20%,
        60% {
          fill: var(--line-active);
          filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.95));
        }
        40%,
        80% {
          fill: #93c5fd;
        }
      }

      .archflow-container .node {
        cursor: grab;
        touch-action: none;
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px));
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .archflow-container .node:hover {
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px)) scale(1.02)
          translateY(-2px);
      }
      .archflow-container .node.dragging,
      .archflow-container .node.dragging:hover {
        cursor: grabbing;
        transition: none;
        transform: translate(var(--drag-x, 0px), var(--drag-y, 0px));
      }
      /* Multi-select: shift-click, rubber-band, or ⬚ Select all. Dragging any
         member moves the whole selection, so the diagram can be shifted around
         the stage in one piece. */
      .archflow-container .node.selected .node-card {
        stroke: var(--accent);
        stroke-width: 2.2;
        filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.55));
      }
      .archflow-container .marquee {
        fill: rgba(99, 102, 241, 0.12);
        stroke: var(--accent);
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        pointer-events: none;
      }
      .archflow-container .node-card {
        fill: var(--node-fill);
        stroke: var(--node-stroke);
        stroke-width: 1.5;
        transition:
          stroke 0.25s,
          fill 0.25s,
          filter 0.25s;
      }

      .archflow-container .node.external .node-card {
        fill: var(--external-fill);
        stroke: var(--external-stroke);
        stroke-dasharray: 5 4;
      }
      .archflow-container .node.active .node-card {
        stroke: var(--node-active-stroke);
        stroke-width: 1.8;
        fill: var(--node-fill);
        filter: drop-shadow(0 2px 8px var(--accent-glow));
      }
      .archflow-container .node.external.active .node-card {
        stroke: var(--line-active);
        fill: var(--external-fill);
      }
      .archflow-container .node.working .node-card {
        animation: workpulse 1.2s ease-in-out infinite;
      }
      @keyframes workpulse {
        0%,
        100% {
          filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0));
          stroke: var(--node-stroke);
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.5));
          stroke: #f59e0b;
        }
      }
      .archflow-container .node.done .node-card {
        stroke: var(--done-stroke);
        fill: var(--done-fill);
      }

      .archflow-container .node-title {
        font-size: 13.5px;
        font-weight: 700;
        fill: var(--ink);
        transition: fill 0.3s;
      }
      .archflow-container .node-sub {
        font-size: 10px;
        fill: var(--muted);
        transition: fill 0.3s;
      }
      .archflow-container .node-icon {
        font-size: 19px;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .archflow-container .pulse {
        fill: var(--line-active);
        stroke: var(--bg);
        stroke-width: 2;
        filter: drop-shadow(0 0 6px var(--line-active));
      }
      .archflow-container .pulse.data {
        fill: #0ea5a4;
        filter: drop-shadow(0 0 6px #0ea5a4);
      }
      .archflow-container .pulse.call {
        fill: #6366f1;
        filter: drop-shadow(0 0 6px #6366f1);
      }

      .archflow-container .bubble-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .archflow-container .bubble-wrap.above {
        align-items: flex-end;
      }
      .archflow-container .bubble-wrap.below {
        align-items: flex-start;
      }

      .archflow-container .bubble {
        position: relative;
        max-width: 190px;
        background: var(--bubble-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid var(--bubble-border);
        border-radius: 10px;
        padding: 6px 10px;
        font-size: 11.5px;
        line-height: 1.3;
        color: var(--bubble-text);
        box-shadow: 0 8px 24px var(--shadow);
        animation: bubbleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        transition:
          background 0.3s,
          border-color 0.3s,
          color 0.3s,
          box-shadow 0.3s;
      }
      @keyframes bubbleIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .archflow-container .bubble-who {
        display: block;
        font-weight: 700;
        font-size: 9px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 3px;
        color: var(--bubble-who-color);
      }
      .archflow-container .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
      }
      .archflow-container .bubble.tail-down::after {
        top: 100%;
        border-top-color: var(--bubble-bg);
        margin-top: -1px;
        transition: border-top-color 0.3s;
      }
      .archflow-container .bubble.tail-up::after {
        bottom: 100%;
        border-bottom-color: var(--bubble-bg);
        margin-bottom: -1px;
        transition: border-bottom-color 0.3s;
      }

      .archflow-container footer {
        padding: 16px 24px 24px;
        font-size: 12.5px;
        color: var(--muted);
        background: var(--panel);
        border-top: 1px solid var(--line);
        line-height: 1.6;
      }
      .archflow-container footer b {
        color: var(--ink);
      }

      .archflow-container .legend {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .archflow-container .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .archflow-container .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 6px currentColor;
      }

      @media (max-width: 980px) {
        .archflow-container .wrap {
          flex-direction: column;
        }
        .archflow-container .side {
          width: auto;
          border-left: none;
          border-top: 1px solid var(--line);
        }
        .archflow-container .log {
          max-height: 32vh;
        }
      }

      .archflow-container .node.db-ingesting .node-card {
        stroke: #336791 !important;
        stroke-width: 2.2px !important;
        animation: dbIngestGlow 0.4s infinite alternate;
      }
      @keyframes dbIngestGlow {
        from {
          filter: drop-shadow(0 0 3px rgba(51, 103, 145, 0.4));
        }
        to {
          filter: drop-shadow(0 0 14px rgba(51, 103, 145, 0.8));
        }
      }

      .archflow-container .transfer-modal {
        font-family: "JetBrains Mono", monospace;
        background: rgba(15, 23, 42, 0.95);
        border: 1.5px solid #336791;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        box-shadow: 0 10px 25px rgba(51, 103, 145, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #e2e8f0;
        opacity: 0;
        transform: scale(0.9) translateY(10px);
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      .archflow-container .transfer-modal.show {
        opacity: 1;
        transform: none;
      }
      .archflow-container .transfer-header {
        background: #1e293b;
        padding: 6px 10px;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .archflow-container .transfer-icon {
        font-size: 10px;
      }
      .archflow-container .transfer-title {
        color: #cbd5e1;
      }
      .archflow-container .transfer-pct {
        margin-left: auto;
        color: #38bdf8;
        font-weight: 800;
      }

      .archflow-container .transfer-progress-container {
        background: #0f172a;
        height: 6px;
        width: calc(100% - 20px);
        margin: 8px 10px 4px;
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid #1e293b;
      }
      .archflow-container .transfer-progress-bar {
        background: linear-gradient(90deg, #336791 0%, #38bdf8 100%);
        height: 100%;
        width: 0%;
        border-radius: 3px;
        transition: width 0.1s linear;
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
      }
      .archflow-container .transfer-stats {
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
        font-size: 8px;
        color: #94a3b8;
      }

      .archflow-container .transfer-log {
        flex: 1;
        background: #090d16;
        margin: 6px 10px 8px;
        border-radius: 4px;

      (function computeOrigins() {
        const seen = new Set();
        STEPS.forEach((s) => {
          if (!seen.has(stepInitiator(s))) ORIGINS.add(stepInitiator(s));
          seen.add(s.f);
          seen.add(s.t);
        });
      })();

      // Every step's status for the CURRENT set of removed links:
      //   'ok'          — runs normally
      //   'blocked'     — its own link was cut
      //   'unreachable' — nothing ever reached its initiator, because an
      //                   upstream step was blocked (or itself unreachable)
      // Pure and order-independent, so an animated run and a scrubber jump
      // always agree. addKey / dropKey answer the hypothetical "what if this
      // one link were also cut / put back?" for the inspector's impact line.
      function computeStatuses(addKey, dropKey) {
        const reached = new Set(ORIGINS);
        // Nodes an earlier step failed to deliver to. A poller reading from a
        // starved node gets nothing, so it can't restart the flow — without
        // this, cutting "user uploads to OneDrive" left the scheduled Power
        // Automate poll (an ORIGIN, since it first appears as a round-trip
        // asker) happily picking up a file that never arrived, and the whole
        // pipeline ran on.
        const starved = new Set();
        return STEPS.map((s) => {
          const key = s.f !== s.t ? pairKey(s.f, s.t) : null;
          const removed = !!key && key !== dropKey && (REMOVED_LINKS.has(key) || key === addKey);
          const initiator = stepInitiator(s);
          // For a round-trip, f is the responder being read from. A node that
          // has simply never been touched yet is fine (the first query to a
          // database); only one that was *supposed* to have been fed counts.
          const readsStarved = s.roundTrip && starved.has(s.f);
          if (removed || readsStarved || !reached.has(initiator)) {
            // The request dies here. The initiator is no longer carrying a
            // live flow, so every later step it would have started is
            // stranded too, and whatever this step was meant to deliver
            // never arrives.
            reached.delete(initiator);
            starved.add(s.t);
            return removed ? 'blocked' : 'unreachable';
          }
          reached.add(s.f);
          reached.add(s.t);
          starved.delete(s.t);
          return 'ok';
        });
      }

      // Cached because it is read once per log entry; invalidated on every
      // remove/restore.
      let STATUS_CACHE = null;
      function stepStatuses() {
        if (!STATUS_CACHE) STATUS_CACHE = computeStatuses();
        return STATUS_CACHE;
      }
      function invalidateStatuses() { STATUS_CACHE = null; }

      function ArchFlowDemo() {
        const [theme, setTheme] = useState('light');
        const [speed, setSpeed] = useState(0.5);
        const [isPlaying, setIsPlaying] = useState(false);
        const [phaseText, setPhaseText] = useState('Ready');

        const [progress, setProgress] = useState(-1);
        // Node inspector: id of the clicked node, or null when closed.

        // Connection inspector: pairKey of the clicked link, or null.

        // Bumped on every remove/restore so the JSX (which reads

        // Same trick for link labels and group boxes, which also live outside

        const [noteVersion, setNoteVersion] = useState(0);
        const [groupVersion, setGroupVersion] = useState(0);

        const logRef = useRef(null);
        const scrubTrackRef = useRef(null);

        const idxRef = useRef(-1);
        const speedRef = useRef(0.5);
        const animRef = useRef(null);
        // True while a ⏭ Step single-step animation runs — jumpTo must not

        // Node cards have been dragged since the last save (enables 💾 Save

        const edgesRef = useRef({});
        const nodeElsRef = useRef({});
        const pulseRef = useRef(null);
        const allArrowsRef = useRef([]);
        const bubbleLayerRef = useRef(null);
        const bubbleElsRef = useRef([]);
        const dbParticlesGroupRef = useRef(null);
        const pgConsoleFORef = useRef(null);
        // Handles into the imperative stage, so the inspector (React) can

        const openLabelEditorRef = useRef(null);
        const renderNoteRef = useRef(null);
        const openNoteEditorRef = useRef(null);
        const renderGroupsRef = useRef(null);
        const openGroupEditorRef = useRef(null);

        const [selCount, setSelCount] = useState(0);

        const toggleGroup = () => {

        const BASE = 2400;

        useEffect(() => { speedRef.current = speed; }, [speed]);
        useEffect(() => { playingRef.current = isPlaying; }, [isPlaying]);
        useEffect(() => () => { if (animRef.current) cancelAnimationFrame(animRef.current); }, []);

        useEffect(() => {
          if (!stageRef.current) return;
          stageRef.current.innerHTML = '';

          const SVGNS = 'http://www.w3.org/2000/svg';
          const el = (tag, attrs, text) => {
            const e = document.createElementNS(SVGNS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
          };

          // SVG text can't wrap or clip itself, so anything that must stay
          // inside a box (card titles, link labels) is measured and trimmed
          // here. Returns true when it had to cut, so the caller can attach
          // the full string as a hover <title>.
          const ellipsize = (t, max) => {
            if (t.getComputedTextLength() <= max) return false;
            const full = t.textContent;
            let lo = 0;
            let hi = full.length - 1;
            while (lo < hi) {
              const mid = Math.ceil((lo + hi) / 2);
              t.textContent = full.slice(0, mid) + '…';
              if (t.getComputedTextLength() <= max) lo = mid;
              else hi = mid - 1;
            }
            t.textContent = full.slice(0, lo).replace(/[\s,;:.-]+$/, '') + '…';
            return true;
          };
          const fullTextTip = (t, full) => t.appendChild(el('title', {}, full));

          const edges = {};
          const directed = new Set();

          STEPS.forEach((s) => {
            if (s.f !== s.t) {
              directed.add(s.f + '>' + s.t);
              const key = pairKey(s.f, s.t);
              if (!edges[key]) edges[key] = { from: s.f, to: s.t, d: buildPath(s.f, s.t) };
            }
          });

          // Group boxes go in first so they sit behind every line and card —
          // they're a backdrop, not something to click through.
          const groupLayer = el('g', {});
          stageRef.current.appendChild(groupLayer);

          const edgeLayer = el('g', {});
          stageRef.current.appendChild(edgeLayer);
          // Transparent wide twins of every edge, so a link can actually be
          // clicked; and the ✕ markers drawn over removed links. Both layers
          // sit BELOW the node groups (appended later), so a node card always
          // wins a click where the two overlap.
          const hitLayer = el('g', {});
          stageRef.current.appendChild(hitLayer);
          const cutLayer = el('g', {});
          stageRef.current.appendChild(cutLayer);

          const edgesCached = {};
          Object.keys(edges).forEach((key) => {
            const e = edges[key];
            const p = el('path', { d: e.d, class: 'edge dashed' });
            edgeLayer.appendChild(p);

            const hit = el('path', { d: e.d, class: 'edge-hit' });
            hit.appendChild(el('title', {}, NODES[e.from].title + ' ⇄ ' + NODES[e.to].title + ' — click to inspect or remove this connection'));
            hit.addEventListener('click', (ev) => {
              ev.stopPropagation();
              setInspected(null);
              setSelectedLink((prev) => (prev === key ? null : key));
            });
            hitLayer.appendChild(hit);

            const cut = el('text', { class: 'edge-cut', x: 0, y: 0 }, '✕');
            cut.style.display = 'none';
            cutLayer.appendChild(cut);

            edgesCached[key] = { el: p, hit, cut, from: e.from, to: e.to, len: p.getTotalLength(), arrows: {} };
          });
          edgesRef.current = edgesCached;

          const arrowLayer = el('g', {});
          stageRef.current.appendChild(arrowLayer);
          const allArrows = [];

          const norm = (x, y) => { const d = Math.hypot(x, y) || 1; return { x: x / d, y: y / d }; };
          const insideCard = (p, n, pad) => p.x >= n.x - pad && p.x <= n.x + NW + pad && p.y >= n.y - pad && p.y <= n.y + NH + pad;

          const arrowPoints = (path, len, n, side) => {
            const STEP = 1;
            const OVERLAP = 2.5;
            let edgeL = 0;
            let tip = { x: 0, y: 0 };
            let dir = { x: 0, y: 0 };

            if (side === 'to') {
              edgeL = 0;
              for (let q = len; q >= 0; q -= STEP) {
                if (!insideCard(path.getPointAtLength(q), n, 0)) { edgeL = q; break; }
              }
              const onEdge = path.getPointAtLength(edgeL);
              const ahead = path.getPointAtLength(Math.min(len, edgeL + 8));
              dir = norm(ahead.x - onEdge.x, ahead.y - onEdge.y);
              tip = { x: onEdge.x + dir.x * OVERLAP, y: onEdge.y + dir.y * OVERLAP };
            } else {
              edgeL = len;
              for (let q = 0; q <= len; q += STEP) {
                if (!insideCard(path.getPointAtLength(q), n, 0)) { edgeL = q; break; }
              }
              const onEdge = path.getPointAtLength(edgeL);
              const back = path.getPointAtLength(Math.max(0, edgeL - 8));
              dir = norm(back.x - onEdge.x, back.y - onEdge.y);
              tip = { x: onEdge.x + dir.x * OVERLAP, y: onEdge.y + dir.y * OVERLAP };

            const size = 7;
            const half = 4;
            const nx = -dir.y;
            const ny = dir.x;
            const bx = tip.x - dir.x * size;
            const by = tip.y - dir.y * size;
            return `${tip.x.toFixed(1)},${tip.y.toFixed(1)} ${(bx + nx * half).toFixed(1)},${(by + ny * half).toFixed(1)} ${(bx - nx * half).toFixed(1)},${(by - ny * half).toFixed(1)}`;
          };

          const makeArrow = (path, len, n, side) => {
            const poly = el('polygon', { points: arrowPoints(path, len, n, side), class: 'arrow' });
            arrowLayer.appendChild(poly);
            allArrows.push(poly);
            return poly;
          };

          Object.keys(edgesRef.current).forEach((key) => {
            const e = edgesRef.current[key];
            const nodesTo = NODES[e.to];
            const nodesFrom = NODES[e.from];
            e.arrows[e.to] = makeArrow(e.el, e.len, nodesTo, 'to');
            if (directed.has(e.to + '>' + e.from) || BIDIRECTIONAL.has(pairKey(e.from, e.to))) {
              e.arrows[e.from] = makeArrow(e.el, e.len, nodesFrom, 'from');
            }
          });
          allArrowsRef.current = allArrows;

          // ---- Link labels ----------------------------------------------
          // Each connection carries a short line of text at its midpoint,
          // sitting on an opaque pill so the dashed line doesn't run through
          // the letters. The layer goes above the lines but below the node
          // groups, so a card still wins any click where the two overlap.
          const LABEL_MAX = 128;
          const LABEL_MIN = 44; // below this a stub reads as noise, so hide it
          const labelLayer = el('g', {});
          stageRef.current.appendChild(labelLayer);

          // How much bare line this link actually exposes between the two
          // cards. Cards are painted over the label layer, so a label wider
          // than this doesn't overflow — it disappears under a card, which is
          // worse. Neighbouring cards make this tiny, so the budget is
          // per-link and recomputed whenever a card moves.
          const freeSpan = (e) => {
            let start = 0;
            let end = e.len;
            for (let q = 0; q <= e.len; q += 2) {
              if (!insideCard(e.el.getPointAtLength(q), NODES[e.from], 2)) { start = q; break; }
            }
            for (let q = e.len; q >= 0; q -= 2) {
              if (!insideCard(e.el.getPointAtLength(q), NODES[e.to], 2)) { end = q; break; }
            }
            return Math.max(0, end - start);
          };
          // A vertical link can still run past a card that sits beside it, so
          // the pill is also tested against every card — not just the two it
          // connects — and slid along the line until it finds clear space.
          const hitsAnyCard = (x, y, w, h) =>
            Object.keys(NODES).some((id) => {
              const n = NODES[id];
              return x < n.x + NW + 2 && x + w > n.x - 2 && y < n.y + NH + 2 && y + h > n.y - 2;
            });
          const LABEL_SLOTS = [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74];

          // matters: a browser only fires dblclick when both clicks land on

          // runs whenever a link is selected) would silently kill the
          // double-click-to-edit gesture.
          const renderLabel = (key) => {
            const e = edgesRef.current[key];
            if (!e || !e.labelG) return;
            const txt = labelFor(key);
            // A severed link already says everything with its ✕ marker, which
            // sits at this exact midpoint — two things there would collide.

              e.labelG.style.display = 'none';
              return;
            }
            // Two cards sitting shoulder to shoulder leave nothing to write
            // on; the inspector still shows the label in full.
            const budget = Math.min(LABEL_MAX, freeSpan(e) - 10);
            if (budget < LABEL_MIN) {
              e.labelG.style.display = 'none';
              return;
            }
            e.labelG.style.display = '';
            e.labelText.textContent = txt; // reset before measuring
            ellipsize(e.labelText, budget);
            const w = e.labelText.getComputedTextLength() + 12;
            let at = null;
            for (let i = 0; i < LABEL_SLOTS.length; i++) {

              if (!hitsAnyCard(pt.x - w / 2, pt.y - 9, w, 18)) { at = pt; break; }
            }
            if (!at) {
              e.labelG.style.display = 'none';
              return;
            }
            e.labelAt = at; // where the editor should open
            e.labelText.setAttribute('x', at.x);
            e.labelText.setAttribute('y', at.y);
            e.labelTip.textContent = txt + ' — double-click to edit';

            e.labelBg.setAttribute('y', at.y - 9);

          renderLabelRef.current = renderLabel;

          // One editor for the whole stage — a real <input> in a foreignObject,
          // parked over whatever is being retitled (a link label or a group
          // name). Enter/blur commits, Esc backs out. Edits persist
          // immediately: they're content, like a removed link, not view state
          // waiting on 💾 Save layout.
          const editorFO = el('foreignObject', { width: 190, height: 34, style: 'display: none;' });
          const editorInput = document.createElement('input');
          editorInput.className = 'edge-label-input';
          editorInput.setAttribute('maxlength', '48');
          editorFO.appendChild(editorInput);
          stageRef.current.appendChild(editorFO);
          let editing = null; // { kind: 'link' | 'group', key }
          const closeEditor = (commit) => {
            if (!editing) return;
            const what = editing;
            editing = null;
            editorFO.style.display = 'none';
            if (!commit) return;
            if (what.kind === 'link') {
              setLinkLabel(what.key, editorInput.value);
              renderLabel(what.key);
              setLabelVersion((v) => v + 1);
            } else if (what.kind === 'note') {
              setNodeNote(what.key, editorInput.value);
              renderNote(what.key);
              setNoteVersion((v) => v + 1);
            } else {
              renameGroup(what.key, editorInput.value);
              renderGroups();
              setGroupVersion((v) => v + 1);
            }
          };
          const openEditorAt = (kind, key, at, value, placeholder) => {
            editing = { kind, key };
            editorFO.setAttribute('x', at.x - 95);
            editorFO.setAttribute('y', at.y - 17);
            editorFO.style.display = '';
            editorInput.setAttribute('placeholder', placeholder);
            editorInput.value = value;
            editorInput.focus();
            editorInput.select();
          };
          const openLabelEditor = (key) => {
            const e = edgesRef.current[key];
            if (!e) return;
            // Open over the label if one is drawn, else at the midpoint.
            const at = e.labelG.style.display !== 'none' && e.labelAt ? e.labelAt : e.el.getPointAtLength(e.len / 2);
            openEditorAt('link', key, at, labelFor(key), 'Label this connection…');
          };
          openLabelEditorRef.current = openLabelEditor;
          // Notes are written where they'll be read: just under the card.
          const openNoteEditor = (id) => {
            const n = NODES[id];
            if (!n) return;
            // openEditorAt centres the box on the point it's given.
            openEditorAt('note', id, { x: n.x + NW / 2, y: n.y + NH + 23 }, noteFor(id), 'Add a note…');
          };
          openNoteEditorRef.current = openNoteEditor;
          editorInput.addEventListener('keydown', (ev) => {
            // The stage owns ⌘A and Esc — while typing, they mean the usual
            // text-field things instead.

            if (ev.key === 'Enter') closeEditor(true);
            else if (ev.key === 'Escape') closeEditor(false);

          Object.keys(edgesRef.current).forEach((key) => {
            const e = edgesRef.current[key];
            const grp = el('g', { class: 'edge-label-g' });
            e.labelTip = el('title', {});
            e.labelBg = el('rect', { class: 'edge-label-bg', rx: 5, x: 0, y: 0, width: 0, height: 18 });
            e.labelText = el('text', { class: 'edge-label', x: 0, y: 0 });

            grp.appendChild(e.labelBg);
            grp.appendChild(e.labelText);
            grp.addEventListener('click', (ev) => {
              ev.stopPropagation();
              setInspected(null);
              setSelectedLink((prev) => (prev === key ? null : key));
            });
            grp.addEventListener('dblclick', (ev) => {
              ev.stopPropagation();
              openLabelEditor(key);
            });
            labelLayer.appendChild(grp);
            e.labelG = grp;
            // Double-clicking anywhere on the line works too — the label may
            // not exist yet, and an empty one is nothing to aim at.
            if (e.hit) {
              e.hit.addEventListener('dblclick', (ev) => {
                ev.stopPropagation();
                openLabelEditor(key);
              });
            }
            renderLabel(key);
          });

          // ---- Group boxes ----------------------------------------------
          // A named box drawn around a set of cards. Elements are kept per
          // group object and only their attributes change, for the same
          // dblclick reason as the link labels — and because this re-runs on
          // every frame of a drag.
          const GROUP_PAD = 20;
          const GROUP_HEAD = 22; // strip above the cards that holds the name
          const groupEls = new Map();
          // Rename in place, over the box's own title strip.
          const openGroupEditor = (g) => {
            const els = groupEls.get(g);
            if (!els) return;
            const at = { x: +els.rect.getAttribute('x') + 95, y: +els.rect.getAttribute('y') + 11 };
            openEditorAt('group', g, at, g.name, 'Name this group…');
          };
          openGroupEditorRef.current = openGroupEditor;
          const renderGroups = () => {
            groupEls.forEach((els, g) => {
              if (GROUP_LIST.indexOf(g) === -1) {
                groupLayer.removeChild(els.g);
                groupEls.delete(g);
              }
            });
            GROUP_LIST.forEach((g) => {
              let els = groupEls.get(g);
              if (!els) {
                const box = el('g', { class: 'group' });
                const tip = el('title', {});
                const rect = el('rect', { class: 'group-box', rx: 14 });
                const name = el('text', { class: 'group-name' });
                box.appendChild(tip);
                box.appendChild(rect);
                box.appendChild(name);
                // Selecting the members is what makes a group draggable: the
                // existing group-drag then moves the whole box as one piece.
                name.addEventListener('click', (ev) => {
                  ev.stopPropagation();
                  setSelection(g.members);
                });
                name.addEventListener('dblclick', (ev) => {
                  ev.stopPropagation();
                  openGroupEditor(g);
                });
                groupLayer.appendChild(box);
                els = { g: box, rect, name, tip };
                groupEls.set(g, els);
              }
              const xs = g.members.map((id) => NODES[id].x);
              const ys = g.members.map((id) => NODES[id].y);
              const x = Math.max(2, Math.min.apply(null, xs) - GROUP_PAD);
              const y = Math.max(2, Math.min.apply(null, ys) - GROUP_PAD - GROUP_HEAD);
              const x2 = Math.min(STAGE_W - 2, Math.max.apply(null, xs) + NW + GROUP_PAD);
              const y2 = Math.min(STAGE_H - 2, Math.max.apply(null, ys) + NH + GROUP_PAD);
              els.g.setAttribute('class', 'group tone-' + g.tone);
              // Membership on the element, so a check (and a reader of the DOM)
              // can tell a card inside the box from a card merely surrounded
              // by it — see the stray-card check in the skill's Step 8.
              els.g.setAttribute('data-members', g.members.join(' '));
              els.rect.setAttribute('x', x);
              els.rect.setAttribute('y', y);
              els.rect.setAttribute('width', Math.max(0, x2 - x));
              els.rect.setAttribute('height', Math.max(0, y2 - y));
              els.name.setAttribute('x', x + 14);
              els.name.setAttribute('y', y + 15);
              els.name.textContent = g.name; // reset before measuring
              ellipsize(els.name, Math.max(40, x2 - x - 28));
              els.tip.textContent = g.name + ' — click to select these cards, double-click to rename';
            });
          };
          renderGroupsRef.current = renderGroups;
          renderGroups();

          const pulse = el('circle', { r: 5.5, class: 'pulse', cx: -100, cy: -100, opacity: 0 });
          pulseRef.current = pulse;

          // Node dragging: NODES coords update live and every edge touching a
          // moved node (path + both arrowheads) is rebuilt each move, so links
          // stay attached while the user pulls cards apart to declutter
          // overlapping edges. A small movement threshold keeps a plain click
          // still opening the inspector.
          //
          // Dragging a SELECTED card moves the whole selection as one rigid
          // block — ⌘/Ctrl+A (or ⬚ Select all) then drag shoves the entire
          // diagram around the stage. The stage clamp is therefore computed
          // for the block, not per card: the offset is capped by whichever
          // members sit furthest out, otherwise cards would pile up against
          // the edge and the arrangement would collapse.
          const svg = stageRef.current;
          const toSvgPoint = (evt) => {
            const pt = svg.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            return pt.matrixTransform(svg.getScreenCTM().inverse());
          };
          const refreshEdges = (ids) => {
            Object.keys(edgesRef.current).forEach((key) => {
              const e = edgesRef.current[key];
              if (!ids.has(e.from) && !ids.has(e.to)) return;
              e.el.setAttribute('d', buildPath(e.from, e.to));
              e.len = e.el.getTotalLength();
              if (e.hit) e.hit.setAttribute('d', e.el.getAttribute('d'));
              if (e.cut) {
                const mid = e.el.getPointAtLength(e.len / 2);
                e.cut.setAttribute('x', mid.x);
                e.cut.setAttribute('y', mid.y);
              }
              Object.keys(e.arrows).forEach((endId) => {
                e.arrows[endId].setAttribute('points', arrowPoints(e.el, e.len, NODES[endId], endId === e.to ? 'to' : 'from'));
              });
              renderLabel(key); // the midpoint moved with the line
            });
          };
          const basePos = {};
          const dragState = { id: null, suppressClick: false, group: [], base: {} };

          const nodeEls = {};
          const noteEls = {};
          // Cards never rewrite their child coordinates — they ride a CSS
          // transform measured from where they were first drawn — so moving a
          // card is "update NODES + update the two vars".
          const moveNode = (nid, x, y) => {
            NODES[nid].x = x;
            NODES[nid].y = y;
            nodeEls[nid].style.setProperty('--drag-x', (x - basePos[nid].x) + 'px');
            nodeEls[nid].style.setProperty('--drag-y', (y - basePos[nid].y) + 'px');
          };
          Object.keys(NODES).forEach((id) => {
            const n = NODES[id];
            const g = el('g', { class: 'node' + (n.external ? ' external' : ''), 'data-id': id });
            g.appendChild(el('rect', { class: 'node-card', x: n.x, y: n.y, width: NW, height: NH, rx: 12 }));
            g.appendChild(el('circle', { cx: n.x + 30, cy: n.y + NH / 2, r: 19, fill: n.color }));
            g.appendChild(el('text', { class: 'node-icon', x: n.x + 30, y: n.y + NH / 2 + 1 }, n.icon));
            g.appendChild(el('text', { class: 'node-title', x: n.x + 58, y: n.y + 31 }, n.title));
            g.appendChild(el('text', { class: 'node-sub', x: n.x + 58, y: n.y + 50 }, n.sub));
            // The note panel lives INSIDE the node group, so it rides the same
            // CSS transform as the card and needs no repositioning on drag.
            const noteBg = el('rect', { class: 'node-note-bg', rx: 7, x: 0, y: 0, width: 0, height: 0 });
            const noteText = el('text', { class: 'node-note' });
            g.appendChild(noteBg);
            g.appendChild(noteText);
            noteEls[id] = { bg: noteBg, text: noteText };
            g.addEventListener('click', () => {
              if (dragState.suppressClick) return;
              setSelectedLink(null);
              setInspected((prev) => (prev === id ? null : id));
            });
            g.addEventListener('dblclick', (ev) => {
              ev.stopPropagation();
              openNoteEditor(id);
            });
            basePos[id] = { x: n.x, y: n.y };
            g.addEventListener('pointerdown', (e) => {
              if (e.button !== 0) return;
              // Shift / ⌘ / Ctrl click adds or removes this card from the
              // selection instead of dragging it or opening the inspector.
              if (e.shiftKey || e.metaKey || e.ctrlKey) {
                const sel = new Set(selectionRef.current);
                if (sel.has(id)) sel.delete(id);
                else sel.add(id);
                setSelection(sel);
                dragState.suppressClick = true;
                return;
              }
              const p = toSvgPoint(e);
              dragState.id = id;
              dragState.suppressClick = false;
              dragState.px = p.x;
              dragState.py = p.y;
              // Grabbing a selected card drags the whole selection; grabbing an
              // unselected one drags only it and leaves the selection alone.
              dragState.group = selectionRef.current.has(id) ? Array.from(selectionRef.current) : [id];
              dragState.base = {};
              let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
              dragState.group.forEach((gid) => {
                const gn = NODES[gid];
                dragState.base[gid] = { x: gn.x, y: gn.y };
                minX = Math.min(minX, gn.x);
                maxX = Math.max(maxX, gn.x);
                minY = Math.min(minY, gn.y);
                maxY = Math.max(maxY, gn.y);
              });
              // Clamp the block, not each card: the offset the whole group may
              // travel is whatever its outermost members still have room for.
              dragState.minDx = 4 - minX;
              dragState.maxDx = STAGE_W - NW - 4 - maxX;
              dragState.minDy = 4 - minY;
              dragState.maxDy = STAGE_H - NH - 4 - maxY;
              g.setPointerCapture(e.pointerId);
            });
            g.addEventListener('pointermove', (e) => {
              if (dragState.id !== id) return;
              const p = toSvgPoint(e);
              let dx = p.x - dragState.px;
              let dy = p.y - dragState.py;
              if (!dragState.suppressClick && Math.hypot(dx, dy) < 3) return;
              dragState.suppressClick = true;
              dx = Math.min(dragState.maxDx, Math.max(dragState.minDx, dx));
              dy = Math.min(dragState.maxDy, Math.max(dragState.minDy, dy));
              const moved = new Set();
              dragState.group.forEach((gid) => {
                const b = dragState.base[gid];
                nodeEls[gid].classList.add('dragging');
                moveNode(gid, b.x + dx, b.y + dy);
                moved.add(gid);
              });
              refreshEdges(moved);
              renderGroups(); // boxes are drawn from where their cards are
            });
            const endDrag = () => {
              if (dragState.id !== id) return;
              dragState.id = null;
              dragState.group.forEach((gid) => nodeEls[gid].classList.remove('dragging'));
              // Dragging is deliberately NOT persisted here — the 💾 Save
              // layout button is what commits it, so a viewer can shove
              // cards around to read a busy diagram and reload to get the
              // saved layout back.
              if (dragState.suppressClick) setLayoutDirty(true);
            };
            g.addEventListener('pointerup', endDrag);
            g.addEventListener('pointercancel', endDrag);
            stageRef.current.appendChild(g);
            nodeEls[id] = g;
          });
          nodeElsRef.current = nodeEls;

          // Keep card text inside the card. Node names come from the
          // architecture doc, so some are simply longer than the 180px box —
          // before this, they ran out over the card edge and across whatever
          // was next to them. Titles shrink a couple of points before they
          // truncate (a component's name is worth more than a uniform type
          // size); subtitles are phrases, so they wrap to a second line first.
          // Whatever still doesn't fit is cut with an ellipsis and gets a
          // <title> so the full string is one hover away (the inspector always
          // shows it in full).
          //
          // Measuring needs the text laid out in the document, which is why
          // this is a pass over the finished cards rather than part of the
          // loop that builds them.
          const TEXT_X = 58; // icon gutter
          const TEXT_MAX = NW - TEXT_X - 12; // minus right padding
          Object.keys(NODES).forEach((id) => {
            const n = NODES[id];
            const titleEl = nodeEls[id].querySelector('.node-title');
            const subEl = nodeEls[id].querySelector('.node-sub');

            let size = 13.5;
            while (titleEl.getComputedTextLength() > TEXT_MAX && size > 11) {
              size = Math.max(11, size - 0.5);
              titleEl.style.fontSize = size + 'px';
            }
            if (ellipsize(titleEl, TEXT_MAX)) fullTextTip(titleEl, n.title);

            if (subEl.getComputedTextLength() > TEXT_MAX) {
              const words = String(n.sub).trim().split(/\s+/);
              if (words.length < 2) {
                // One unbreakable word — nothing to wrap, so just trim it.
                if (ellipsize(subEl, TEXT_MAX)) fullTextTip(subEl, n.sub);
              } else {
                // Longest first line that fits, so line 2 carries the rest.
                let cut = words.length - 1;
                while (cut > 1) {
                  subEl.textContent = words.slice(0, cut).join(' ');
                  if (subEl.getComputedTextLength() <= TEXT_MAX) break;
                  cut--;
                }
                subEl.textContent = '';
                const l1 = el('tspan', { x: n.x + TEXT_X, y: n.y + 47 }, words.slice(0, cut).join(' '));
                const l2 = el('tspan', { x: n.x + TEXT_X, y: n.y + 59 }, words.slice(cut).join(' '));
                subEl.appendChild(l1);
                subEl.appendChild(l2);
                const cut1 = ellipsize(l1, TEXT_MAX);
                const cut2 = ellipsize(l2, TEXT_MAX);
                if (cut1 || cut2) fullTextTip(subEl, n.sub);
              }
            }
          });

          // ---- Node notes -----------------------------------------------
          // A viewer's own margin, pinned under the card: the caveats a
          // diagram can't hold. Wrapped to at most three lines the width of
          // the card, on a quiet panel so it reads as attached to that card
          // rather than floating on the stage. Everything sits inside the
          // node group, so a dragged card takes its note with it.
          const NOTE_W = NW + 16;
          const NOTE_LINES = 3;
          const NOTE_LH = 13;
          const renderNote = (id) => {
            const els = noteEls[id];
            if (!els) return;
            const n = NODES[id];
            const txt = noteFor(id);
            while (els.text.firstChild) els.text.removeChild(els.text.firstChild);
            if (!txt) {
              els.text.style.display = 'none';
              els.bg.style.display = 'none';
              return;
            }
            els.text.style.display = '';
            els.bg.style.display = '';
            // Greedy wrap: fill each line with as many words as fit, and trim
            // the last one if the note outruns the three lines it's given.
            const max = NOTE_W - 16;
            const widthOf = (s) => {
              els.text.textContent = s; // the element itself is the ruler
              return els.text.getComputedTextLength();
            };
            const lines = [];
            let line = '';
            txt.split(' ').forEach((w) => {
              const next = line ? line + ' ' + w : w;
              if (line && widthOf(next) > max) {
                lines.push(line);
                line = w;
              } else {
                line = next;
              }
            });
            if (line) lines.push(line);
            const shown = lines.slice(0, NOTE_LINES);
            // Anything past the third line joins it and gets trimmed there.
            if (lines.length > NOTE_LINES) shown[NOTE_LINES - 1] += ' ' + lines.slice(NOTE_LINES).join(' ');
            els.text.textContent = '';

            const top = n.y + NH + 8;
            let widest = 0;
            shown.forEach((s, i) => {
              const t = el('tspan', { x: n.x + NW / 2, y: top + 12 + i * NOTE_LH }, s);
              els.text.appendChild(t);
              ellipsize(t, max);
              widest = Math.max(widest, t.getComputedTextLength());
            });
            els.bg.setAttribute('x', n.x + NW / 2 - widest / 2 - 8);
            els.bg.setAttribute('y', top);
            els.bg.setAttribute('width', widest + 16);
            els.bg.setAttribute('height', shown.length * NOTE_LH + 8);
          };
          renderNoteRef.current = renderNote;
          Object.keys(NODES).forEach(renderNote);

          stageRef.current.appendChild(pulse);

          const bubbleLayer = el('g', {});
          stageRef.current.appendChild(bubbleLayer);
          bubbleLayerRef.current = bubbleLayer;

          const dbParticlesGroup = el('g', { id: 'dbParticlesGroup' });
          stageRef.current.appendChild(dbParticlesGroup);
          dbParticlesGroupRef.current = dbParticlesGroup;

          if (DB_INGEST_TO) {
            const pgConsoleFO = el('foreignObject', { id: 'pgConsoleFO', x: DB_INGEST_CONSOLE_X, y: DB_INGEST_CONSOLE_Y, width: 255, height: 155, style: 'display: none;' });
            const consoleDiv = document.createElement('div');
            consoleDiv.className = 'transfer-modal';
            consoleDiv.innerHTML = `
              <div class="transfer-header">
                <span class="transfer-icon">${DB_INGEST_ICON}</span>
                <span class="transfer-title">${DB_INGEST_TITLE}</span>
                <span class="transfer-pct" id="transferPct">0%</span>
              </div>
              <div class="transfer-progress-container">
                <div class="transfer-progress-bar" id="transferProgressBar"></div>
              </div>
              <div class="transfer-stats">
                <div class="transfer-stat">Records: <span id="transferFiles">0 / ${DB_INGEST_FILES.length}</span></div>
                <div class="transfer-stat">Rate: <span id="transferRate">45.8 KB/s</span></div>
                <div class="transfer-stat">Time Left: <span id="transferTimeLeft">15s</span></div>
              </div>
              <div class="transfer-log" id="transferLog"></div>
            `;
            pgConsoleFO.appendChild(consoleDiv);
            stageRef.current.appendChild(pgConsoleFO);
            pgConsoleFORef.current = pgConsoleFO;
          }

          // Rubber-band selection. Appended last so the band draws over
          // everything, and pointer-events:none so it can never swallow the
          // drag that is creating it.
          const marquee = el('rect', { class: 'marquee', x: 0, y: 0, width: 0, height: 0, style: 'display: none;' });
          stageRef.current.appendChild(marquee);

          // A pointerdown whose target IS the <svg> happened on empty stage —
          // anything drawn (card, edge, hit twin) is its own target, so this
          // never steals a click from them.
          const band = { on: false, moved: false, x0: 0, y0: 0, keep: [] };
          svg.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || e.target !== svg || e.pointerType === 'touch') return;
            const p = toSvgPoint(e);
            band.on = true;
            band.moved = false;
            band.x0 = p.x;
            band.y0 = p.y;
            // Shift-banding extends the current selection instead of replacing it.
            band.keep = e.shiftKey || e.metaKey || e.ctrlKey ? Array.from(selectionRef.current) : [];
            svg.setPointerCapture(e.pointerId);
          });
          svg.addEventListener('pointermove', (e) => {
            if (!band.on) return;
            const p = toSvgPoint(e);
            const x = Math.min(band.x0, p.x);
            const y = Math.min(band.y0, p.y);
            const w = Math.abs(p.x - band.x0);
            const h = Math.abs(p.y - band.y0);
            if (!band.moved && Math.hypot(w, h) < 3) return;
            band.moved = true;
            marquee.setAttribute('x', x);
            marquee.setAttribute('y', y);
            marquee.setAttribute('width', w);
            marquee.setAttribute('height', h);
            marquee.style.display = '';
            // Touched, not enclosed: brushing a card is enough to catch it.
            const hit = new Set(band.keep);
            Object.keys(NODES).forEach((nid) => {
              const nn = NODES[nid];
              if (nn.x < x + w && nn.x + NW > x && nn.y < y + h && nn.y + NH > y) hit.add(nid);
            });
            setSelection(hit);
          });
          const endBand = () => {
            if (!band.on) return;
            band.on = false;
            marquee.style.display = 'none';
            // A click on empty stage (no band drawn) means "deselect".
            if (!band.moved) setSelection([]);
          };
          svg.addEventListener('pointerup', endBand);
          svg.addEventListener('pointercancel', endBand);

          resetAnimation(false);
        }, []);

        // Paint selection + severed styling from the current REMOVED_LINKS
        // set. Declared AFTER the build effect on purpose: effects run in
        // declaration order, and this one needs the edges to exist (a demo
        // reloaded with removals in storage must show them severed on the
        // first paint).
        useEffect(() => {
          Object.keys(edgesRef.current).forEach((key) => {
            const e = edgesRef.current[key];
            const off = REMOVED_LINKS.has(key);
            e.el.classList.toggle('removed', off);
            e.el.classList.toggle('selected', key === selectedLink);
            Object.values(e.arrows).forEach((a) => a.classList.toggle('removed', off));
            if (e.cut) {
              const mid = e.el.getPointAtLength(e.len / 2);
              e.cut.setAttribute('x', mid.x);
              e.cut.setAttribute('y', mid.y);
              e.cut.style.display = off ? '' : 'none';
            }
            // Labels hide behind the ✕ of a severed link and come back when
            // it's restored, so this has to run with the rest of the repaint.
            if (renderLabelRef.current) renderLabelRef.current(key);
          });
        }, [selectedLink, linkVersion, labelVersion]);

        // Remove / restore one connection. The demo is re-rendered at the
        // current step so the consequence is immediately visible: steps that
        // need the link turn into blocked log entries (and vice versa).
        function toggleLink(key) {
          if (!key) return;
          if (REMOVED_LINKS.has(key)) REMOVED_LINKS.delete(key);
          else REMOVED_LINKS.add(key);
          saveRemovedLinks();
          invalidateStatuses();
          setLinkVersion((v) => v + 1);
          jumpTo(idxRef.current);
        }

        function restoreAllLinks() {
          if (REMOVED_LINKS.size === 0) return;
          REMOVED_LINKS.clear();
          saveRemovedLinks();
          invalidateStatuses();
          setLinkVersion((v) => v + 1);
          jumpTo(idxRef.current);
        }

        // How many LATER steps this link strands (or, once cut, would get
        // back) — the answer to "is this connection load-bearing?", shown in
        // the inspector before the user commits to cutting it.
        function strandedBy(key) {
          if (!key) return 0;
          const now = stepStatuses();
          if (REMOVED_LINKS.has(key)) {
            const restored = computeStatuses(null, key);
            return now.filter((s, i) => s === 'unreachable' && restored[i] !== 'unreachable').length;
          }
          const cut = computeStatuses(key, null);
          return cut.filter((s, i) => s === 'unreachable' && now[i] !== 'unreachable').length;
        }

        function clearActive() {
          Object.values(edgesRef.current).forEach((e) => e.el.classList.remove('active', 'flow', 'call', 'data', 'flow-reverse', 'blocked-flash'));
          Object.values(nodeElsRef.current).forEach((g) => g.classList.remove('active', 'working', 'db-ingesting', 'blocked'));
          if (pulseRef.current) pulseRef.current.setAttribute('opacity', '0');
          allArrowsRef.current.forEach((a) => a.classList.remove('blink'));
          clearBubbles();
          if (pgConsoleFORef.current) {
            pgConsoleFORef.current.style.display = 'none';
            const innerConsole = pgConsoleFORef.current.querySelector('.transfer-modal');
            if (innerConsole) innerConsole.classList.remove('show');
          }
          if (dbParticlesGroupRef.current) dbParticlesGroupRef.current.innerHTML = '';
        }

        function clearBubbles() {
          while (bubbleElsRef.current.length > 0) {
            const fo = bubbleElsRef.current.pop();
            if (fo && bubbleLayerRef.current) bubbleLayerRef.current.removeChild(fo);
          }
        }

        function addBubble(nodeId, text) {
          const n = NODES[nodeId];
          if (!n || !bubbleLayerRef.current) return;

          const top = n.y < STAGE_H / 2;
          const W = 200;
          const foH = top ? 95 : 85;
          let bx = n.x + NW / 2 - W / 2;
          bx = Math.max(8, Math.min(bx, STAGE_W - W - 8));
          const by = top ? n.y - 101 : n.y + NH + 4;

          const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
          fo.setAttribute('x', String(bx));
          fo.setAttribute('y', String(by));
          fo.setAttribute('width', String(W));
          fo.setAttribute('height', String(foH));

          const wrap = document.createElement('div');
          wrap.className = 'bubble-wrap ' + (top ? 'above' : 'below');
          const b = document.createElement('div');
          b.className = 'bubble ' + (top ? 'tail-down' : 'tail-up');
          const who = document.createElement('span');
          who.className = 'bubble-who';
          who.textContent = NODES[nodeId].title;
          b.appendChild(who);
          b.appendChild(document.createTextNode(text));
          wrap.appendChild(b);
          fo.appendChild(wrap);

          bubbleLayerRef.current.appendChild(fo);
          bubbleElsRef.current.push(fo);
        }

        function blinkArrow(edge, destId) {
          const a = edge.arrows[destId];
          if (!a) return;
          a.classList.remove('blink');
          void a.getBBox();
          a.classList.add('blink');
        }

        function travelBall(edge, srcId, dstId, kind, travelMs) {
          return new Promise((res) => {
            const forward = edge.from === srcId;
            edge.el.classList.remove('call', 'data', 'flow-reverse');
            edge.el.classList.add(kind);
            if (!forward) edge.el.classList.add('flow-reverse');
            if (pulseRef.current) {
              pulseRef.current.setAttribute('class', 'pulse ' + (kind === 'data' ? 'data' : 'call'));
              pulseRef.current.setAttribute('opacity', '1');
            }
            const t0 = performance.now();
            const tick = (now) => {
              let p = (now - t0) / travelMs;
              if (p > 1) p = 1;
              const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
              const t = forward ? eased : 1 - eased;
              const pt = edge.el.getPointAtLength(edge.len * t);
              if (pulseRef.current) { pulseRef.current.setAttribute('cx', String(pt.x)); pulseRef.current.setAttribute('cy', String(pt.y)); }
              if (p >= 1) res(); else animRef.current = requestAnimationFrame(tick);
            };
            animRef.current = requestAnimationFrame(tick);
          });
        }

        function waitMs(ms) {
          return new Promise((res) => {
            const t0 = performance.now();
            const tick = (now) => { if (now - t0 >= ms) res(); else animRef.current = requestAnimationFrame(tick); };
            animRef.current = requestAnimationFrame(tick);
          });
        }

        function addLog(i) {
          if (!logRef.current) return;
          const s = STEPS[i];
          logRef.current.querySelectorAll('.log-item.cur').forEach((n) => n.classList.remove('cur'));
          const item = document.createElement('div');
          const st = stepStatuses()[i];
          const note = st === 'blocked'
            ? '<span class="log-blocked">blocked — connection removed</span>'
            : st === 'unreachable'
              ? '<span class="log-skipped">skipped — never reached</span>'
              : '';
          const num = st === 'blocked' ? '✕' : st === 'unreachable' ? '–' : i + 1;
          item.className = 'log-item cur ' + s.k + (st === 'ok' ? '' : ' ' + st);
          item.innerHTML = `
            <div class="log-num">${num}</div>
            <div class="log-body">
              <span class="log-route">${s.route}</span>
              ${note}
              ${s.m}
            </div>
          `;
          item.title = 'Jump to this step';
          item.addEventListener('click', () => jumpTo(i));
          logRef.current.appendChild(item);
          logRef.current.scrollTop = logRef.current.scrollHeight;
        }

        function markDone(id) {
          const node = nodeElsRef.current[id];
          if (node) node.classList.add('done');
        }

        function triggerDbIngestAnimation(currentSpeed) {
          return new Promise((resolveAnimation) => {
            const dbNode = nodeElsRef.current[DB_INGEST_TO];
            if (dbNode) dbNode.classList.add('db-ingesting');

            if (pgConsoleFORef.current) {
              pgConsoleFORef.current.style.display = 'block';
              pgConsoleFORef.current.getBoundingClientRect();
              const innerConsole = pgConsoleFORef.current.querySelector('.transfer-modal');
              if (innerConsole) innerConsole.classList.add('show');
            }

            const pctEl = document.getElementById('transferPct');
            const barEl = document.getElementById('transferProgressBar');
            const filesEl = document.getElementById('transferFiles');
            const rateEl = document.getElementById('transferRate');
            const timeLeftEl = document.getElementById('transferTimeLeft');
            const localLogEl = document.getElementById('transferLog');
            if (localLogEl) localLogEl.innerHTML = '';

            const files = DB_INGEST_FILES;
            const totalDuration = 15000 / currentSpeed;
            const startTime = performance.now();
            let lastFileIdx = -1;
            let lastRateUpdate = 0;
            const transferActive = true;

            function addConsoleLog(text, type = 'normal') {
              if (!localLogEl) return;
              const line = document.createElement('div');
              line.className = 'log-line ' + type;
              line.textContent = text;
              localLogEl.appendChild(line);
              localLogEl.scrollTop = localLogEl.scrollHeight;
            }

            addConsoleLog('Opening transaction...', 'active');

            const progressTick = (now) => {
              if (!transferActive) return;
              const elapsed = now - startTime;
              const pct = Math.min(100, (elapsed / totalDuration) * 100);

              if (pctEl) pctEl.textContent = Math.round(pct) + '%';
              if (barEl) barEl.style.width = pct + '%';

              const secondsLeft = Math.max(0, Math.ceil((totalDuration - elapsed) / 1000));
              if (timeLeftEl) timeLeftEl.textContent = secondsLeft + 's';

              if (now - lastRateUpdate > 1200) {
                lastRateUpdate = now;
                const rate = (30 + Math.random() * 25).toFixed(1);
                if (rateEl) rateEl.textContent = rate + ' KB/s';
              }

              const step = 100 / files.length;
              const fileIdx = Math.floor(pct / step);
              if (fileIdx > lastFileIdx && fileIdx < files.length) {
                lastFileIdx = fileIdx;
                const f = files[fileIdx];
                if (filesEl) filesEl.textContent = `${fileIdx + 1} / ${files.length}`;
                addConsoleLog(`[${Math.round(pct)}%] Writing ${f.name} (${f.size})...`, 'active');
                if (localLogEl) {
                  const lines = localLogEl.querySelectorAll('.log-line');
                  if (lines.length > 1) {
                    const prevLine = lines[lines.length - 2];
                    prevLine.className = 'log-line success';
                    prevLine.textContent = '✓ ' + prevLine.textContent.substring(4);
                  }
                }
              }

              if (pct < 100) {
                animRef.current = requestAnimationFrame(progressTick);
              } else {
                if (filesEl) filesEl.textContent = `${files.length} / ${files.length}`;
                if (timeLeftEl) timeLeftEl.textContent = '0s';
                if (localLogEl) {
                  const lines = localLogEl.querySelectorAll('.log-line');
                  if (lines.length > 0) {
                    const last = lines[lines.length - 1];
                    last.className = 'log-line success';
                    if (last.textContent.startsWith('[')) last.textContent = '✓ ' + last.textContent.substring(6);
                  }
                }
                addConsoleLog('✓ COMMIT — transaction closed.', 'success');
                addConsoleLog('Saved. Next run will be smarter.', 'finish');
                setTimeout(() => { if (dbNode) dbNode.classList.remove('db-ingesting'); resolveAnimation(); }, 1000);
              }
            };
            animRef.current = requestAnimationFrame(progressTick);

            if (dbParticlesGroupRef.current) {
              dbParticlesGroupRef.current.innerHTML = '';
              const { startX, startY, endX, endY } = DB_INGEST_PARTICLE_PATH;
              const spawnInterval = 500 / currentSpeed;
              let spawnedCount = 0;
              const maxSpawns = Math.floor(totalDuration / spawnInterval) - 2;
              const fileEmojis = ['📄', '📝', '📊', '📁', '⚡', '🗃️'];

              const spawnFileIcon = () => {
                if (spawnedCount >= maxSpawns || !transferActive || !dbParticlesGroupRef.current) return;
                spawnedCount++;
                const emoji = fileEmojis[Math.floor(Math.random() * fileEmojis.length)];
                const p = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                p.setAttribute('x', String(startX));
                p.setAttribute('y', String(startY));
                p.setAttribute('font-size', '13px');
                p.setAttribute('text-anchor', 'middle');
                p.setAttribute('dominant-baseline', 'middle');
                p.setAttribute('opacity', '0.9');
                p.setAttribute('style', `cursor: default; user-select: none; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';`);
                p.textContent = emoji;
                dbParticlesGroupRef.current.appendChild(p);

                const iconStartTime = performance.now();
                const duration = (900 + Math.random() * 400) / currentSpeed;
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetY = -25 - Math.random() * 45;

                const animateIcon = (now) => {
                  const elapsed = now - iconStartTime;
                  const pct = Math.min(1, elapsed / duration);
                  const eased = pct < 0.5 ? 4 * pct * pct * pct : 1 - Math.pow(-2 * pct + 2, 3) / 2;
                  const cx = startX + (endX - startX) * eased + offsetX * Math.sin(pct * Math.PI);
                  const cy = startY + (endY - startY) * eased + offsetY * Math.sin(pct * Math.PI);
                  const rotation = eased * 360;
                  p.setAttribute('x', String(cx));
                  p.setAttribute('y', String(cy));
                  p.setAttribute('transform', `rotate(${rotation}, ${cx}, ${cy})`);
                  p.setAttribute('opacity', String(1 - eased));
                  if (pct < 1) requestAnimationFrame(animateIcon); else p.remove();
                };
                requestAnimationFrame(animateIcon);
                setTimeout(spawnFileIcon, spawnInterval);
              };
              spawnFileIcon();
            }
          });
        }

        function runStep(i) {
          return new Promise((resolve) => {
            const s = STEPS[i];
            clearActive();
            setPhaseText(PHASES[s.ph]);
            setProgress(i);
            addLog(i);

            const currentSpeed = speedRef.current;
            let dur = BASE / currentSpeed;
            const V = 0.125 * currentSpeed;

            const status = stepStatuses()[i];

            // The link this step needs was removed by the user: nothing
            // travels. The source flashes red, says why, and the run carries
            // on to the next step — that "what still works without this
            // link?" read is the whole point of cutting a connection.
            if (status === 'blocked') {
              const srcNode = nodeElsRef.current[stepInitiator(s)];
              if (srcNode) srcNode.classList.add('active', 'blocked');
              const deadEdge = edgesRef.current[pairKey(s.f, s.t)];
              if (deadEdge) deadEdge.el.classList.add('blocked-flash');
              const other = stepInitiator(s) === s.f ? s.t : s.f;
              addBubble(stepInitiator(s), '✕ No connection to ' + NODES[other].title);
              const tBlocked = performance.now();
              const blockedTick = (now) => {
                if (now - tBlocked >= 1300 / currentSpeed) resolve();
                else animRef.current = requestAnimationFrame(blockedTick);
              };
              animRef.current = requestAnimationFrame(blockedTick);
              return;
            }

            // Nothing ever reached this step's initiator, because an upstream
            // step was blocked. It can't happen, so nothing is drawn — the
            // log entry (already added above) carries the "skipped — never
            // reached" note and the run moves on after a short beat.
            if (status === 'unreachable') {
              const tSkipped = performance.now();
              const skipTick = (now) => {
                if (now - tSkipped >= 450 / currentSpeed) resolve();
                else animRef.current = requestAnimationFrame(skipTick);
              };
              animRef.current = requestAnimationFrame(skipTick);
              return;
            }

            const chat = s.chat || [];
            const shownChat = new Array(chat.length).fill(false);
            const revealChat = (elapsed) => {
              for (let c = 0; c < chat.length; c++) {
                if (shownChat[c]) continue;
                const at = dur * Math.min(0.5, c * 0.42);
                if (elapsed >= at) { shownChat[c] = true; addBubble(chat[c][0], chat[c][1]); }
              }
            };

            if (s.f === s.t) {
              dur = 1600 / currentSpeed;
              const activeNode = nodeElsRef.current[s.f];
              if (activeNode) activeNode.classList.add('active', 'working');
              const t0 = performance.now();
              const tick = (now) => {
                revealChat(now - t0);
                if (now - t0 >= dur) {
                  if (activeNode) activeNode.classList.remove('working');
                  markDone(s.f);
                  resolve();
                } else {
                  animRef.current = requestAnimationFrame(tick);
                }
              };
              animRef.current = requestAnimationFrame(tick);
              return;
            }

            if (s.roundTrip) {
              const rtEdge = edgesRef.current[pairKey(s.f, s.t)];
              const asker = s.t;
              const responder = s.f;
              rtEdge.el.classList.remove('call', 'data');
              rtEdge.el.classList.add('active', 'flow', 'call');
              const askerNode = nodeElsRef.current[asker];
              const responderNode = nodeElsRef.current[responder];
              if (askerNode) askerNode.classList.add('active');
              if (responderNode) responderNode.classList.add('active');

              const leg = rtEdge.len / V;
              (async () => {
                if (chat[0]) addBubble(chat[0][0], chat[0][1]);
                await travelBall(rtEdge, asker, responder, 'call', leg);
                blinkArrow(rtEdge, responder);
                await waitMs(200 / currentSpeed);
                if (chat[1]) addBubble(chat[1][0], chat[1][1]);
                await travelBall(rtEdge, responder, asker, 'data', leg);
                blinkArrow(rtEdge, asker);
                await waitMs(300 / currentSpeed);
                markDone(asker);
                markDone(responder);
                resolve();
              })();
              return;
            }

            const edge = edgesRef.current[pairKey(s.f, s.t)];
            const forward = edge.from === s.f;
            edge.el.classList.remove('call', 'data', 'flow-reverse');
            edge.el.classList.add('active', 'flow', s.k);
            if (!forward) edge.el.classList.add('flow-reverse');
            const fromNode = nodeElsRef.current[s.f];
            const toNode = nodeElsRef.current[s.t];
            if (fromNode) fromNode.classList.add('active');
            if (toNode) toNode.classList.add('active');

            if (pulseRef.current) {
              pulseRef.current.setAttribute('class', 'pulse ' + (s.k === 'data' ? 'data' : 'call'));
              pulseRef.current.setAttribute('opacity', '1');
            }

            const travel = edge.len / V;
            dur = travel + 600 / currentSpeed;
            const t0 = performance.now();
            let arrived = false;

            const tick = async (now) => {
              revealChat(now - t0);
              let p = (now - t0) / travel;
              if (p > 1) p = 1;
              const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
              const t = forward ? eased : 1 - eased;
              const pt = edge.el.getPointAtLength(edge.len * t);
              if (pulseRef.current) { pulseRef.current.setAttribute('cx', String(pt.x)); pulseRef.current.setAttribute('cy', String(pt.y)); }

              if (p >= 1 && !arrived) {
                arrived = true;
                blinkArrow(edge, s.t);
                if (DB_INGEST_TO && s.f === DB_INGEST_FROM && s.t === DB_INGEST_TO) triggerDbIngestAnimation(currentSpeed);
              }

              const extraWait = DB_INGEST_TO && s.f === DB_INGEST_FROM && s.t === DB_INGEST_TO ? 15000 / currentSpeed : 0;
              if (p >= 1 && now - t0 >= dur + extraWait) {
                markDone(s.f);
                markDone(s.t);
                resolve();
              } else {
                animRef.current = requestAnimationFrame(tick);
              }
            };
            animRef.current = requestAnimationFrame(tick);
          });
        }

        async function advance() {
          if (idxRef.current >= STEPS.length - 1) { stopPlay(); return false; }
          idxRef.current++;
          await runStep(idxRef.current);
          if (idxRef.current >= STEPS.length - 1) {
            stopPlay();
            resetAnimation(true, true);
            setPhaseText('Run completed');
            markRunCompleteInLog();
          }
          return true;
        }

        function markRunCompleteInLog() {
          if (!logRef.current) return;
          logRef.current.querySelectorAll('.log-item.cur').forEach((n) => n.classList.remove('cur'));
          const statuses = stepStatuses();
          const blocked = statuses.filter((s) => s === 'blocked').length;
          const skipped = statuses.filter((s) => s === 'unreachable').length;
          const parts = [];
          if (blocked) parts.push(blocked + ' blocked');
          if (skipped) parts.push(skipped + ' never reached');
          const item = document.createElement('div');
          item.className = 'log-item cur';
          item.innerHTML = `
            <div class="log-num" style="background: ${parts.length ? '#ef4444' : '#22c55e'};">${parts.length ? '!' : '✓'}</div>
            <div class="log-body">
              <span class="log-route">System</span>
              Run completed${parts.length ? ' — ' + parts.join(', ') : ''}
            </div>
          `;
          logRef.current.appendChild(item);
          logRef.current.scrollTop = logRef.current.scrollHeight;
        }

        async function loop() {
          while (playingRef.current) {
            const more = await advance();
            if (!more) break;
          }
        }

        function startPlay() {
          if (idxRef.current >= STEPS.length - 1) resetAnimation(false);
          else if (idxRef.current === -1 && logRef.current) logRef.current.innerHTML = '';
          setIsPlaying(true);
          playingRef.current = true;
          loop();
        }

        function stopPlay() {
          setIsPlaying(false);
          playingRef.current = false;
          if (animRef.current) cancelAnimationFrame(animRef.current);
        }

        function resetAnimation(repaint = true, keepLogs = false) {
          stopPlay();
          idxRef.current = -1;
          setProgress(-1);
          clearActive();
          Object.values(nodeElsRef.current).forEach((g) => g.classList.remove('done'));
          if (!keepLogs && logRef.current) logRef.current.innerHTML = '';
          if (repaint) setPhaseText('Ready');
        }

        // Jump the demo to the state where step `target` has just completed:
        // done-marks and the activity log are rebuilt for steps 0..target, and
        // the target step's nodes, edge and chat are shown statically so the
        // jumped-to moment reads at a glance. target = -1 lands on "Ready".
        // Backs the scrubber, the ⏮ Back button, the clickable activity log,
        // and the inspector's step chips.
        function jumpTo(target) {
          if (ffRef.current) return;
          stopPlay();
          target = Math.max(-1, Math.min(STEPS.length - 1, target));
          idxRef.current = target;
          setProgress(target);
          clearActive();
          Object.values(nodeElsRef.current).forEach((g) => g.classList.remove('done'));
          if (logRef.current) logRef.current.innerHTML = '';
          const statuses = stepStatuses();
          for (let i = 0; i <= target; i++) {
            // A blocked or unreachable step never ran, so neither end gets a
            // done-mark.
            if (statuses[i] === 'ok') {
              markDone(STEPS[i].f);
              markDone(STEPS[i].t);
            }
            addLog(i);
          }
          if (target < 0) {
            setPhaseText('Ready');
            return;
          }
          const s = STEPS[target];
          setPhaseText(PHASES[s.ph]);
          if (statuses[target] === 'blocked') {
            const srcNode = nodeElsRef.current[stepInitiator(s)];
            if (srcNode) srcNode.classList.add('active', 'blocked');
            const other = stepInitiator(s) === s.f ? s.t : s.f;
            addBubble(stepInitiator(s), '✕ No connection to ' + NODES[other].title);
            return;
          }
          // An unreachable step has nothing to show on the stage.
          if (statuses[target] === 'unreachable') return;
          const fromNode = nodeElsRef.current[s.f];
          const toNode = nodeElsRef.current[s.t];
          if (fromNode) fromNode.classList.add('active');
          if (toNode) toNode.classList.add('active');
          if (s.f !== s.t) {
            const edge = edgesRef.current[pairKey(s.f, s.t)];
            if (edge) edge.el.classList.add('active', s.k === 'data' ? 'data' : 'call');
          }
          (s.chat || []).forEach((c) => addBubble(c[0], c[1]));
        }

        function scrubToEvent(e) {
          const track = scrubTrackRef.current;
          if (!track) return;
          const r = track.getBoundingClientRect();
          let frac = (e.clientX - r.left) / r.width;
          frac = Math.max(0, Math.min(0.999, frac));
          const i = Math.floor(frac * STEPS.length);
          if (i !== idxRef.current) jumpTo(i);
        }

        // Advance exactly ONE step, animated at the current speed. The step's
        // final state (active edge, chat bubbles) stays on screen afterwards
        // so the user can read what just happened before stepping again.
        async function handleStep() {
          if (playingRef.current || ffRef.current) return;
          if (idxRef.current >= STEPS.length - 1) return;
          setIsDoneDisabled(true);
          ffRef.current = true;
          await advance();
          ffRef.current = false;
          setIsDoneDisabled(false);
        }

        function adjustSpeed(amount) {
          let nextSpeed = speed + amount;
          nextSpeed = parseFloat(nextSpeed.toFixed(1));
          if (nextSpeed >= 0.1 && nextSpeed <= 3.0) setSpeed(nextSpeed);
        }

        return (
          <div ref={containerRef} className={`archflow-container ${theme === 'light' ? 'light' : ''}`}>
            <header>
              <div>
                <h1>{TITLE}</h1>
                <p>{SUBTITLE}</p>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="Toggle theme">
                  {theme === 'dark' ? '☀ Light' : '🌙 Dark'}
                </button>
                <button onClick={toggleFullscreen} title={isFullscreen ? 'Exit Fullscreen' : 'Enter Fullscreen'}>
                  {isFullscreen ? '🗗 Exit' : '⛶ Fullscreen'}
                </button>
              </div>
            </header>

            <div className="toolbar">
              <button onClick={() => (isPlaying ? stopPlay() : startPlay())} className={!isPlaying ? 'primary' : ''} disabled={isDoneDisabled}>
                {isPlaying ? '⏸ Pause' : progress >= STEPS.length - 1 ? '▶ Replay' : '▶ Play'}
              </button>
              <button onClick={() => jumpTo(idxRef.current - 1)} disabled={isPlaying || isDoneDisabled || progress < 0} title="Back one step">⏮ Back</button>
              <button onClick={handleStep} disabled={isPlaying || isDoneDisabled}>⏭ Step</button>
              <button onClick={() => resetAnimation(true)} disabled={isDoneDisabled}>↻ Restart</button>
              <button
                onClick={() => {
                  saveLayout();
                  setLayoutDirty(false);
                  setLayoutSaved(true);
                  setTimeout(() => setLayoutSaved(false), 1600);
                }}
                disabled={!layoutDirty}
                title="Remember where you dragged the cards, so this layout comes back on reload"
              >
                {layoutSaved ? '✓ Saved' : '💾 Save layout'}
              </button>
              <button onClick={exportLayout} title="Download the current card positions and link labels so they can be baked into the file as the defaults (survives browser profiles and machines)">
                ⬇ Export edits
              </button>
              <button onClick={toggleSelectAll} title="Select every card (⌘/Ctrl+A), then drag any one of them to move the whole diagram. Shift-click a card or rubber-band the empty stage to pick a few; Esc clears.">
                {selCount ? `✕ Clear (${selCount})` : '⬚ Select all'}
              </button>
              <button
                onClick={toggleGroup}
                disabled={matchedGroup === -1 && selCount < 2}
                title={matchedGroup === -1
                  ? 'Draw a named box around the selected cards (select two or more first)'
                  : 'Remove this box — the cards stay where they are'}
              >
                {matchedGroup === -1 ? '▣ Group' : '⤫ Ungroup'}
              </button>
              <button onClick={restoreAllLinks} disabled={REMOVED_LINKS.size === 0} title="Reconnect every link you removed (click a link on the diagram to remove one)">
                ⛓ Links{REMOVED_LINKS.size > 0 ? ` (${REMOVED_LINKS.size})` : ''}
              </button>
              <span className="speed">
                Speed
                <button onClick={() => adjustSpeed(-0.1)} className="speed-btn" disabled={isDoneDisabled}>−</button>
                <span id="speedVal">{speed.toFixed(1)}×</span>
                <button onClick={() => adjustSpeed(0.1)} className="speed-btn" disabled={isDoneDisabled}>+</button>
              </span>
              <span className="spacer"></span>
              <span className="phase-tag">{phaseText}</span>
            </div>

            <div className="scrubber">
              <span className="scrub-count">{progress + 1} / {STEPS.length}</span>
              <div
                ref={scrubTrackRef}
                className="scrub-track"
                title="Drag or click to jump to any step"
                onPointerDown={(e) => {
                  if (isDoneDisabled) return;
                  e.currentTarget.setPointerCapture(e.pointerId);
                  scrubToEvent(e);
                }}
                onPointerMove={(e) => {
                  if (isDoneDisabled || e.buttons !== 1) return;
                  scrubToEvent(e);
                }}
              >
                {STEPS.map((s, i) => (
                  <div
                    key={i}
                    className={
                      'scrub-seg' +
                      (i <= progress ? ' filled' : '') +
                      (i > 0 && STEPS[i - 1].ph !== s.ph ? ' phase-start' : '')
                    }
                  />
                ))}
              </div>
            </div>

            <div className="wrap">
              <div className="stage-area">
                <svg ref={stageRef} className="stage" viewBox={`0 0 ${STAGE_W} ${STAGE_H}`} preserveAspectRatio="xMidYMid meet" aria-label={TITLE}></svg>
              </div>
              <aside className="side">
                {selectedLink && NODES[selectedLink.split('|')[0]] && NODES[selectedLink.split('|')[1]] && (
                  <div className="inspector">
                    <div className="inspector-head">
                      <span className="inspector-icon link-icon">⇄</span>
                      <div className="inspector-name">
                        <div className="inspector-title">
                          {NODES[selectedLink.split('|')[0]].title} ⇄ {NODES[selectedLink.split('|')[1]].title}
                        </div>
                        <div className="inspector-sub">Connection</div>
                      </div>
                      <button className="inspector-close" onClick={() => setSelectedLink(null)} title="Close inspector">✕</button>
                    </div>
                    {REMOVED_LINKS.has(selectedLink) && (
                      <span className="inspector-badge danger">Removed — every step over this link is blocked</span>
                    )}
                    {strandedBy(selectedLink) > 0 && (
                      <p className="inspector-impact">
                        {REMOVED_LINKS.has(selectedLink)
                          ? `Restoring it also brings back ${strandedBy(selectedLink)} later step${strandedBy(selectedLink) === 1 ? '' : 's'} that nothing currently reaches.`
                          : `Cutting it also strands ${strandedBy(selectedLink)} later step${strandedBy(selectedLink) === 1 ? '' : 's'} — nothing downstream would reach them.`}
                      </p>
                    )}
                    <div className="inspector-section">Label on the line</div>
                    <div className="inspector-label-row">
                      <span className={'inspector-label-value' + (labelFor(selectedLink) ? '' : ' empty')}>
                        {labelFor(selectedLink) || 'No label'}
                      </span>
                      <button
                        className="inspector-label-edit"
                        onClick={() => openLabelEditorRef.current && openLabelEditorRef.current(selectedLink)}
                        title="Type the protocol or payload this connection carries (or double-click the line itself)"
                      >
                        ✎ Edit
                      </button>
                    </div>
                    <div className="inspector-section">Carries</div>
                    <ul className="inspector-routes">
                      {linkInfo(selectedLink).routes.map((r) => (
                        <li key={r}>{r}</li>
                      ))}
                    </ul>
                    <div className="inspector-section">Used in steps{REMOVED_LINKS.has(selectedLink) ? ' (blocked)' : ''}</div>
                    <div className="inspector-steps">
                      {linkInfo(selectedLink).stepIdxs.map((i) => (
                        <button key={i} className="inspector-step-chip" onClick={() => jumpTo(i)} title={STEPS[i].m}>{i + 1}</button>
                      ))}
                    </div>
                    <button
                      className={'inspector-action' + (REMOVED_LINKS.has(selectedLink) ? '' : ' danger')}
                      onClick={() => toggleLink(selectedLink)}
                      title={REMOVED_LINKS.has(selectedLink) ? 'Put this connection back' : 'Cut this connection and see which steps stop working'}
                    >
                      {REMOVED_LINKS.has(selectedLink) ? '↺ Restore connection' : '✂ Remove connection'}
                    </button>
                  </div>
                )}
                {inspected && NODES[inspected] && (
                  <div className="inspector">
                    <div className="inspector-head">
                      <span className="inspector-icon" style={{ background: NODES[inspected].color }}>{NODES[inspected].icon}</span>
                      <div className="inspector-name">
                        <div className="inspector-title">{NODES[inspected].title}</div>
                        <div className="inspector-sub">{NODES[inspected].sub}</div>
                      </div>
                      <button className="inspector-close" onClick={() => setInspected(null)} title="Close inspector">✕</button>
                    </div>
                    {NODES[inspected].external && (
                      <span className="inspector-badge">External system — depended on, not owned</span>
                    )}
                    {NODES[inspected].desc && <p className="inspector-desc">{NODES[inspected].desc}</p>}
                    <div className="inspector-section">Note under the card</div>
                    <div className="inspector-label-row">
                      <span className={'inspector-label-value' + (noteFor(inspected) ? '' : ' empty')}>
                        {noteFor(inspected) || 'No note'}
                      </span>
                      <button
                        className="inspector-label-edit"
                        onClick={() => openNoteEditorRef.current && openNoteEditorRef.current(inspected)}
                        title="Pin your own text under this card (or double-click the card itself)"
                      >
                        ✎ Edit
                      </button>
                    </div>
                    <div className="inspector-section">Connections</div>
                    <ul className="inspector-routes">
                      {nodeInfo(inspected).routes.map((r) => (
                        <li key={r}>{r}</li>
                      ))}
                    </ul>
                    <div className="inspector-section">Appears in steps</div>
                    <div className="inspector-steps">
                      {nodeInfo(inspected).stepIdxs.map((i) => (
                        <button key={i} className="inspector-step-chip" onClick={() => jumpTo(i)} title={STEPS[i].m}>{i + 1}</button>
                      ))}
                    </div>
                  </div>
                )}
                <h2>Activity log</h2>
                <div ref={logRef} className="log"></div>
              </aside>
            </div>

            <footer>
              <div className="legend">
                <span><i className="dot" style={{ background: 'var(--accent)' }}></i> control / hand-off</span>
                <span><i className="dot" style={{ background: '#0ea5a4' }}></i> data returned</span>
                <span><i className="dot" style={{ background: '#f59e0b' }}></i> working</span>
                <span><i className="dot" style={{ background: '#374151', border: '1px dashed #94a3b8' }}></i> external system</span>
                <span><i className="dot" style={{ background: '#ef4444' }}></i> click a link to remove it</span>
              </div>
              <b>Eight layers, one corpus.</b> Every document becomes Markdown; the <b>RAG engine</b> indexes it in <b>PostgreSQL + pgvector</b> (embedded locally by <b>Ollama</b>) and the <b>knowledge graph</b> maps what it connects, with a copy in <b>Neo4j</b>. All three agents share one <b>Agent Runtime</b> — the tool loop, the tools, <b>Hindsight</b> memory and the quote verifier. <b>Claude</b> reasons and writes but never searches. An <b>Evaluation</b> layer scores all three: <b>Ragas</b> judges every RAG answer, the agents’ runs are scored from their own checks, and the graph is checked for structure and Cypher accuracy — all into <b>Langfuse</b>.
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<ArchFlowDemo />);
    </script>

    <script>
      (function () {
        var source = document.getElementById("app-source").textContent;
        var output = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]],
        }).code;
        var script = document.createElement("script");
        script.textContent = output;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
